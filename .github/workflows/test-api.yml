name: Test API

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install fastapi uvicorn requests

      - name: Test Price Alert
        env:
          PYTHONPATH: backend
        run: |
          python -c "from app.main import app"
          python -c "from app.models.price_alert import PriceAlert"
          python -c "from app.services.price_alert_service import PriceAlertService"
          python -c "from app.api.routes import price_alert; print(price_alert('فولاد', 9700, 10000))"
          echo "Price Alert API OK"
