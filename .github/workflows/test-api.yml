name: Test API

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install fastapi uvicorn

      - name: Test MarketData imports
        run: |
          python -c "from app.models.market_data import MarketData"
          python -c "from app.providers.normalizer import normalize_market_data"
          python -c "from app.services.market_data_service import MarketDataService"
          python -c "from app.main import app"
          echo "MarketData chain OK"
