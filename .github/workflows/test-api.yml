name: Test API

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install fastapi uvicorn requests

      - name: Test Symbol API
        env:
          PYTHONPATH: backend
        run: |
          python -c "from app.main import app"
          python -c "from app.api.routes import market_data; print(market_data('فولاد'))"
          echo "Symbol API OK"
