name: Test API

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install fastapi uvicorn requests

      - name: Test Market History
        env:
          PYTHONPATH: backend
        run: |
          python -c "from app.main import app"
          python -c "from app.models.market_history import MarketHistory"
          python -c "from app.providers.tsetmc_provider import TSETMCProvider"
          python -c "from app.api.routes import market_history; print(market_history('فولاد'))"
          echo "Market History API OK"
