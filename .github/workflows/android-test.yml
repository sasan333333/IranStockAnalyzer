name: Android Tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check Android project
        run: |
          find android -maxdepth 6 -type f | sort

      - name: Check backend
        run: |
          python -m py_compile backend/app/api/routes.py
          python -m py_compile backend/app/services/market_data_service.py
