name: Final Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install fastapi uvicorn requests

      - name: Final Backend Test
        env:
          PYTHONPATH: backend
        run: |
          python -c "from app.main import app"
          python -c "from app.providers.tsetmc_provider import TSETMCProvider"
          python -c "from app.providers.normalizer import normalize_market_data, normalize_market_history"
          python -c "from app.services.market_data_service import MarketDataService"
          python -c "from app.services.price_alert_service import PriceAlertService"
          python -c "from app.services.telegram_service import TelegramService"
          python -c "from app.models.market_data import MarketData"
          python -c "from app.models.market_history import MarketHistory"
          python -c "from app.models.price_alert import PriceAlert"
          python -c "from app.analysis.technical import sma, ema, rsi, macd, trend_signal"
          echo "FINAL BACKEND TEST OK"
